name: NaiveFox draft release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target (use all for a draft release)
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - windows
          - android

permissions:
  contents: read

concurrency:
  group: naivefox-draft-release
  cancel-in-progress: false

env:
  PRODUCT_BRANCH: naivefox-minimal-source
  ANDROID_NDK_REVISION: "29.0.14206865"
  MACH_NO_TERMINAL_FOOTER: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  guard:
    name: Verify product branch
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse non-product runs
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/${PRODUCT_BRANCH}"

  metadata:
    name: Freeze release metadata
    needs: guard
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      release_date: ${{ steps.metadata.outputs.release_date }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
      product_tree_hash: ${{ steps.metadata.outputs.product_tree_hash }}
    steps:
      - name: Check out the selected product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Compute immutable release metadata
        id: metadata
        shell: bash
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          release_date="$(date -u +%Y%m%d)"
          release_tag="naivefox-${release_date}-${short_sha}"
          product_tree_hash="$(
            git ls-tree HEAD |
              awk -F '\t' '$2 != ".github"' |
              sha256sum |
              cut -d ' ' -f1
          )"
          case "${BUILD_TARGET}" in
            all)
              build_matrix='{"include":[{"platform":"linux","runner":"ubuntu-24.04","package_name":"naivefox-linux-x86_64","archive_suffix":"linux-x86_64.tar.xz"},{"platform":"windows","runner":"windows-2022","package_name":"naivefox-windows-x86_64","archive_suffix":"windows-x86_64.zip"},{"platform":"android","runner":"ubuntu-24.04","package_name":"naivefox-android-aarch64","archive_suffix":"android-aarch64.tar.xz"}]}'
              ;;
            linux)
              build_matrix='{"include":[{"platform":"linux","runner":"ubuntu-24.04","package_name":"naivefox-linux-x86_64","archive_suffix":"linux-x86_64.tar.xz"}]}'
              ;;
            windows)
              build_matrix='{"include":[{"platform":"windows","runner":"windows-2022","package_name":"naivefox-windows-x86_64","archive_suffix":"windows-x86_64.zip"}]}'
              ;;
            android)
              build_matrix='{"include":[{"platform":"android","runner":"ubuntu-24.04","package_name":"naivefox-android-aarch64","archive_suffix":"android-aarch64.tar.xz"}]}'
              ;;
            *)
              echo "unsupported build target: ${BUILD_TARGET}" >&2
              exit 2
              ;;
          esac
          {
            echo "source_sha=${source_sha}"
            echo "short_sha=${short_sha}"
            echo "release_date=${release_date}"
            echo "release_tag=${release_tag}"
            echo "build_matrix=${build_matrix}"
            echo "product_tree_hash=${product_tree_hash}"
          } >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - name: Check out the frozen product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 1

      - name: Identify runner image
        id: runner_image
        shell: bash
        run: |
          set -euo pipefail
          echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" \
            >> "${GITHUB_OUTPUT}"

      - name: Restore staged product cache
        id: staged_cache
        if: matrix.platform != 'android'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/obj-naivefox-${{ matrix.platform }}/package/${{ matrix.package_name }}
          key: naivefox-stage-v1-${{ matrix.platform }}-${{ steps.runner_image.outputs.version }}-${{ needs.metadata.outputs.product_tree_hash }}

      - name: Restore cbindgen cache
        if: (matrix.platform == 'linux' || matrix.platform == 'android') && steps.staged_cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cbindgen
          key: naivefox-cbindgen-v1-${{ runner.os }}-${{ runner.arch }}-0.29.4

      - name: Prepare Linux build environment
        if: matrix.platform == 'linux' && steps.staged_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang-20 \
            libasound2-dev \
            libclang-20-dev \
            libdbus-1-dev \
            libdbus-glib-1-dev \
            libgtk-3-dev \
            libpulse-dev \
            libx11-xcb-dev \
            libxt-dev \
            lld-20 \
            nasm
          if ! cbindgen --version 2>/dev/null | grep -qx 'cbindgen 0.29.4'; then
            cargo install cbindgen --version 0.29.4 --locked
          fi

      - name: Prepare Android build environment
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            clang-20 \
            libclang-20-dev \
            lld-20 \
            nasm \
            ripgrep
          ndk_dir="${ANDROID_HOME:?}/ndk/${ANDROID_NDK_REVISION}"
          test -f "${ndk_dir}/source.properties"
          grep -Fqx \
            "Pkg.Revision = ${ANDROID_NDK_REVISION}" \
            "${ndk_dir}/source.properties"
          echo "NAIVEFOX_ANDROID_NDK=${ndk_dir}" >> "${GITHUB_ENV}"
          rustup target add aarch64-linux-android
          if ! cbindgen --version 2>/dev/null | grep -qx 'cbindgen 0.29.4'; then
            cargo install cbindgen --version 0.29.4 --locked
          fi

      - name: Prepare MozillaBuild
        if: matrix.platform == 'windows' && steps.staged_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup.exe'
          curl.exe --fail --location `
            'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe' `
            --output $installer
          7z x $installer '-oC:\mozilla-build' -y
          if (-not (Test-Path 'C:\mozilla-build\VERSION')) {
            throw 'MozillaBuild extraction did not produce C:\mozilla-build\VERSION'
          }
          # 7-Zip does not preserve the installer's empty MSYS2 /tmp
          # directory. Without it, sh.exe writes a warning before the
          # mozconfig protocol markers and mach's parser fails, then hangs
          # during Python shutdown.
          New-Item -ItemType Directory -Force `
            -Path 'C:\mozilla-build\msys2\tmp' | Out-Null

          $nasmArchive = Join-Path $env:RUNNER_TEMP 'nasm-3.01-win64.zip'
          $nasmRoot = Join-Path $env:RUNNER_TEMP 'nasm-3.01-win64'
          curl.exe --fail --location `
            'https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip' `
            --output $nasmArchive
          $nasmSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $nasmArchive).Hash
          if ($nasmSha256 -ne 'E0BA5157007ABC7B1A65118A96657A961DDF55F7E3F632EE035366DFCE039CA4') {
            throw "unexpected NASM archive SHA-256: $nasmSha256"
          }
          7z x $nasmArchive "-o$nasmRoot" -y
          $nasm = Get-ChildItem -Path $nasmRoot -Filter nasm.exe -Recurse |
            Select-Object -First 1
          if (-not $nasm) {
            throw "NASM extraction did not produce nasm.exe below $nasmRoot"
          }
          $nasm.DirectoryName | Out-File `
            -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # This is the x86_64 runtime-DLL bundle produced by Firefox's
          # win64-WindowsAppSDK toolchain job for this source revision.
          $appSdkArchive = Join-Path $env:RUNNER_TEMP `
            'winappsdk-x86_64-pc-windows-msvc.tar.zst'
          $appSdkParent = Join-Path $env:RUNNER_TEMP 'windows-app-sdk'
          curl.exe --fail --location `
            'https://firefox-ci-tc.services.mozilla.com/api/queue/v1/task/WB_mKg31SO2GAGiahx2A8w/artifacts/public/build/winappsdk-x86_64-pc-windows-msvc.tar.zst' `
            --output $appSdkArchive
          $appSdkSha256 = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $appSdkArchive
          ).Hash
          if ($appSdkSha256 -ne 'BEFC65BD587A7268C30E3EE45AFC787C6E2F138767E039F7B71E34B83C7A696A') {
            throw "unexpected Windows App SDK archive SHA-256: $appSdkSha256"
          }
          New-Item -ItemType Directory -Force -Path $appSdkParent | Out-Null
          tar.exe -xf $appSdkArchive -C $appSdkParent
          if ($LASTEXITCODE -ne 0) {
            throw "failed to extract $appSdkArchive"
          }
          $appSdkDir = Join-Path $appSdkParent `
            'winappsdk-x86_64-pc-windows-msvc'
          $requiredAppSdkDlls = @(
            'CoreMessagingXP.dll',
            'marshal.dll',
            'Microsoft.InputStateManager.dll',
            'Microsoft.Internal.FrameworkUdk.dll',
            'Microsoft.UI.Composition.OSSupport.dll',
            'Microsoft.UI.Input.dll',
            'Microsoft.UI.Windowing.Core.dll',
            'Microsoft.UI.Windowing.dll'
          )
          foreach ($dll in $requiredAppSdkDlls) {
            if (-not (Test-Path (Join-Path $appSdkDir $dll))) {
              throw "Windows App SDK extraction is missing $dll"
            }
          }
          "MOZ_WINDOWS_APP_SDK_DIR=$appSdkDir" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $windowsRsArchive = Join-Path $env:RUNNER_TEMP 'windows-0.62.2.crate'
          $windowsRsParent = Join-Path $env:RUNNER_TEMP 'windows-rs'
          curl.exe --fail --location `
            'https://static.crates.io/crates/windows/windows-0.62.2.crate' `
            --output $windowsRsArchive
          $windowsRsSha256 = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $windowsRsArchive
          ).Hash
          if ($windowsRsSha256 -ne '527FADEE13E0C05939A6A05D5BD6EEC6CD2E3DBD648B9F8E447C6518133D8580') {
            throw "unexpected windows Rust crate SHA-256: $windowsRsSha256"
          }
          New-Item -ItemType Directory -Force -Path $windowsRsParent | Out-Null
          tar.exe -xf $windowsRsArchive -C $windowsRsParent
          if ($LASTEXITCODE -ne 0) {
            throw "failed to extract $windowsRsArchive"
          }
          $windowsRsDir = Join-Path $windowsRsParent 'windows-0.62.2'
          if (
            -not (Test-Path (Join-Path $windowsRsDir 'Cargo.toml')) -or
            -not (Test-Path (Join-Path $windowsRsDir 'src\Windows\mod.rs'))
          ) {
            throw "windows Rust crate extraction is incomplete below $windowsRsDir"
          }
          "MOZ_WINDOWS_RS_DIR=$windowsRsDir" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and stage NaiveFox
        if: steps.staged_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux)
              mozconfig=netwerk/naivefox/mozconfig-minimal
              export CC=clang-20
              export CXX=clang++-20
              export HOST_CC=clang-20
              export HOST_CXX=clang++-20
              export LINKER=lld-20
              export LLVM_OBJDUMP=llvm-objdump-20
              export LIBCLANG_PATH=/usr/lib/llvm-20/lib
              ;;
            windows)
              mozconfig=netwerk/naivefox/mozconfig-windows-x86_64
              export MOZILLABUILD='C:\mozilla-build'
              ;;
            android)
              mozconfig=netwerk/naivefox/mozconfig-android-aarch64
              ndk_bin="${NAIVEFOX_ANDROID_NDK:?}/toolchains/llvm/prebuilt/linux-x86_64/bin"
              export CC="${ndk_bin}/clang"
              export CXX="${ndk_bin}/clang++"
              export HOST_CC=clang-20
              export HOST_CXX=clang++-20
              export LINKER=lld-20
              export LLVM_OBJDUMP=llvm-objdump-20
              export LIBCLANG_PATH=/usr/lib/llvm-20/lib
              ;;
          esac
          # The product branch intentionally omits Firefox's Taskcluster
          # toolchain graph. Use the runner's pinned NDK through Mozilla's
          # native --with-android-ndk interface and disable source-checkout
          # bootstrap without enabling MOZ_AUTOMATION.
          printf '\nac_add_options --disable-bootstrap\n' >> "${mozconfig}"
          if [[ "${{ matrix.platform }}" == android ]]; then
            printf 'ac_add_options --with-android-ndk="%s"\n' \
              "${NAIVEFOX_ANDROID_NDK:?}" >> "${mozconfig}"
          fi
          runner_temp="${RUNNER_TEMP//\\//}"
          objdir="${runner_temp}/obj-naivefox-${{ matrix.platform }}"
          mkdir -p "${objdir}/package"
          export MOZCONFIG="$mozconfig"
          export NAIVEFOX_OBJDIR="$objdir"
          printf 'Configuring NaiveFox (10 minute limit)...\n'
          python3 - "$PWD/mach" <<'PY'
          import subprocess
          import sys

          try:
              subprocess.run(
                  [sys.executable, sys.argv[1], "configure"],
                  check=True,
                  timeout=600,
              )
          except subprocess.TimeoutExpired as exc:
              raise SystemExit("mach configure timed out after 600 seconds") from exc
          PY
          printf 'NaiveFox configure completed.\n'
          ./netwerk/naivefox/tools/build-product.sh "${{ matrix.platform }}" \
            --objdir "${objdir}"

      - name: Verify desktop transport parsing and runtime startup
        if: matrix.platform != 'android'
        shell: python
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          platform = os.environ["BUILD_PLATFORM"]
          if (os.name == "nt") != (platform == "windows"):
              raise SystemExit("desktop verification requires native platform Python")
          temporary = Path(os.environ["RUNNER_TEMP"])
          package = temporary / f"obj-naivefox-{platform}" / "package"
          package /= f"naivefox-{platform}-x86_64"
          binary = package / ("naivefox.exe" if platform == "windows" else "runtime/naivefox")
          launcher = package / ("naivefox.exe" if platform == "windows" else "naivefox")
          work = temporary / f"naivefox-runtime-checks-{platform}"
          work.mkdir(exist_ok=True)
          environment = {key: value for key, value in os.environ.items() if key not in {
              "LD_LIBRARY_PATH", "LD_PRELOAD", "SSLKEYLOGFILE", "SSL_CERT_FILE",
              "NAIVEFOX_PROFILE", "NAIVEFOX_PROXY_USER", "NAIVEFOX_PROXY_PASS",
              "MOZ_RUN_GTEST", "MOZ_LOG", "MOZ_LOG_FILE",
          }}
          environment.update(MOZ_CRASHREPORTER_DISABLE="1", TMPDIR=str(work),
                             TEMP=str(work), TMP=str(work))
          subprocess.run([
              sys.executable, "netwerk/naivefox/test/integration/run-transport-cli-tests.py",
              "--binary", str(binary), "--work-dir", str(work),
          ], env=environment, check=True, timeout=180)
          with tempfile.TemporaryDirectory(prefix="profile-", dir=work) as profile:
              subprocess.run([
                  str(launcher), "--profile", profile, "--runtime-smoke",
              ], env=environment, check=True, timeout=30)

      - name: Verify Android embedded package
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="${RUNNER_TEMP//\\//}"
          objdir="${runner_temp}/obj-naivefox-android"
          package_dir="${objdir}/package/naivefox-android-aarch64"
          ./netwerk/naivefox/tools/verify-staged-android-runtime.sh \
            "${package_dir}"
          NAIVEFOX_OBJDIR="${objdir}" \
            ./netwerk/naivefox/test/integration/run-android-embedded-tests.sh \
              --package "${package_dir}" --check-only

      - name: Archive Linux package
        if: matrix.platform == 'linux'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_dir="$PWD/release-assets"
          runner_temp="${RUNNER_TEMP//\\//}"
          package_parent="${runner_temp}/obj-naivefox-linux/package"
          mkdir -p "${release_dir}"
          tar -C "${package_parent}" -cJf \
            "${release_dir}/${RELEASE_TAG}-linux-x86_64.tar.xz" \
            naivefox-linux-x86_64
          (
            cd "${release_dir}"
            sha256sum "${RELEASE_TAG}-linux-x86_64.tar.xz" \
              > "${RELEASE_TAG}-linux-x86_64.tar.xz.sha256"
            sha256sum -c "${RELEASE_TAG}-linux-x86_64.tar.xz.sha256"
          )

      - name: Archive Windows package
        if: matrix.platform == 'windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_dir="$PWD/release-assets"
          runner_temp="${RUNNER_TEMP//\\//}"
          package_parent="${runner_temp}/obj-naivefox-windows/package"
          mkdir -p "${release_dir}"
          (
            cd "${package_parent}"
            7z a -tzip "${release_dir}/${RELEASE_TAG}-windows-x86_64.zip" \
              naivefox-windows-x86_64
          )
          (
            cd "${release_dir}"
            sha256sum "${RELEASE_TAG}-windows-x86_64.zip" \
              > "${RELEASE_TAG}-windows-x86_64.zip.sha256"
            sha256sum -c "${RELEASE_TAG}-windows-x86_64.zip.sha256"
          )

      - name: Archive Android package
        if: matrix.platform == 'android'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_dir="$PWD/release-assets"
          runner_temp="${RUNNER_TEMP//\\//}"
          package_parent="${runner_temp}/obj-naivefox-android/package"
          mkdir -p "${release_dir}"
          tar -C "${package_parent}" -cJf \
            "${release_dir}/${RELEASE_TAG}-android-aarch64.tar.xz" \
            naivefox-android-aarch64
          (
            cd "${release_dir}"
            sha256sum "${RELEASE_TAG}-android-aarch64.tar.xz" \
              > "${RELEASE_TAG}-android-aarch64.tar.xz.sha256"
            sha256sum -c "${RELEASE_TAG}-android-aarch64.tar.xz.sha256"
          )

      - name: Upload platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: naivefox-${{ matrix.platform }}-${{ needs.metadata.outputs.short_sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create or update draft release
    if: inputs.target == 'all'
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the frozen release provenance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 1

      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: naivefox-*
          path: assets
          merge-multiple: true

      - name: Write draft release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          {
            echo "NaiveFox product build from \`${SOURCE_SHA}\`."
            echo
            echo "Classic remains the default Naive-compatible CONNECT transport."
            echo
            echo "No-connect now uses the productive shaped native WebSocket after its fixed HTTP startup. Only classic and no-connect are supported."
            echo
            echo "Upgrade the client and naivefox-transport server together. The server wire profile is native-stream-v1 and its WebSocket subprotocol is nfc1.stream.v1. Old finite HTTP and hybrid/asymmetric selectors are retired."
            echo
            echo "No-connect with quic:// requires UDP for startup and TCP for the subsequent WebSocket phase."
            echo
            echo "Packages are first staged as a draft for checksum and platform verification."
            echo
            echo "SHA-256 checksums:"
            for checksum in assets/*.sha256; do
              cat "${checksum}"
            done
          } > assets/release-notes.md

      - name: Verify or create the annotated release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          tag_ref="refs/tags/${RELEASE_TAG}"
          tag_message="${RUNNER_TEMP}/naivefox-release-tag.txt"
          {
            printf 'NaiveFox release %s\n' "${RELEASE_TAG}"
            printf 'Product snapshot SHA: %s\n\n' "${SOURCE_SHA}"
            cat UPSTREAM-BASE
          } | git stripspace > "${tag_message}"
          if git ls-remote --exit-code --refs origin "${tag_ref}" \
              > "${RUNNER_TEMP}/naivefox-release-tag-ref.txt"; then
            git fetch --no-tags origin "${tag_ref}:${tag_ref}"
            test "$(git cat-file -t "${tag_ref}")" = tag
            test "$(git rev-parse "${tag_ref}^{commit}")" = "${SOURCE_SHA}"
            git cat-file tag "${tag_ref}" | sed '1,/^$/d' \
              > "${RUNNER_TEMP}/naivefox-existing-tag.txt"
            cmp "${tag_message}" "${RUNNER_TEMP}/naivefox-existing-tag.txt"
          else
            status=$?
            test "${status}" -eq 2
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag --annotate "${RELEASE_TAG}" "${SOURCE_SHA}" \
                --file "${tag_message}"
            git push origin "${tag_ref}"
          fi

      - name: Create or update draft release (never publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find assets -maxdepth 1 -type f \
            \( -name '*.tar.xz' -o -name '*.zip' -o -name '*.sha256' \) -print | sort)
          test "${#archives[@]}" -eq 6
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json isDraft --jq '.isDraft' >/tmp/release-is-draft 2>/dev/null; then
            test "$(cat /tmp/release-is-draft)" = true
            gh release upload "${RELEASE_TAG}" "${archives[@]}" \
              --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "NaiveFox ${RELEASE_TAG}" \
              --notes-file assets/release-notes.md \
              --target "${SOURCE_SHA}" \
              --draft
          else
            gh release create "${RELEASE_TAG}" "${archives[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SOURCE_SHA}" \
              --verify-tag \
              --title "NaiveFox ${RELEASE_TAG}" \
              --notes-file assets/release-notes.md \
              --draft
          fi
