[package]
edition = "2015"
name = "gkrust"
version = "0.1.0"
authors = ["The Mozilla Project Developers"]
license = "MPL-2.0"
description = "Rust code for libxul"
rust-version.workspace = true

[dependencies]
gkrust-naivefox = { path = "naivefox", optional = true }
gkrust-shared = { path = "shared", optional = true }
mozilla-central-workspace-hack = { version = "0.1", features = ["gkrust"], optional = true }

# Workarounds for https://github.com/rust-lang/rust/issues/58393
mozglue-static = { path = "../../../mozglue/static/rust" }
swgl = { path = "../../../gfx/wr/swgl", optional = true }

[features]
full = ["dep:gkrust-shared", "dep:swgl"]
naivefox = ["dep:gkrust-naivefox"]

[dev-dependencies]
stylo_tests = { path = "../../../servo/ports/geckolib/tests/" }

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
test = false
doctest = false
bench = false
doc = false
harness = false

[package.metadata.cargo-udeps.ignore]
normal = ["mozilla-central-workspace-hack"]
